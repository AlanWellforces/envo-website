# Broken-link detection against the LIVE site (scripts/check-links.ts).
#
# Three triggers:
#   - pull_request → main:  release gate — the dev→main PR shows the live
#     site's current link health before shipping. (CI has no DB/Tailscale
#     access, so it can't crawl the *candidate* build — run
#     `npm run check:links` against a local build for that; see DEPLOY.md.)
#   - push → main: the box auto-deploys ~3 min after main moves; wait it
#     out, then crawl the freshly deployed site. This is the real
#     post-release verification.
#   - daily cron + manual dispatch: catch content/data drift between releases.
#
# If Cloudflare ever starts challenging the runner (checker UA is
# `envo-link-check/1`), allowlist that UA in the CF dashboard.

name: link-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 18 * * *' # daily 18:17 UTC ≈ 06:17 NZT
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Wait for the box to deploy this push
        if: github.event_name == 'push'
        # A fixed sleep raced slow builds (run #84 hit a mid-deploy outage and
        # reported 6 phantom dead links) — after the usual poll-timer + build
        # window, poll until the site is actually serving again: 3 consecutive
        # 200s so we don't start crawling in the middle of the container swap.
        run: |
          sleep 420 # poll timer ~3 min + typical build
          deadline=$(( $(date +%s) + 900 ))
          streak=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://envolighting.com/ || echo 000)
            if [ "$code" = "200" ]; then streak=$((streak + 1)); else streak=0; fi
            echo "homepage → $code (healthy streak $streak/3)"
            if [ "$streak" -ge 3 ]; then exit 0; fi
            sleep 10
          done
          echo "::error::site not healthy 22+ min after push — deploy stuck or site down"
          exit 1
      - run: npx tsx scripts/check-links.ts --base https://envolighting.com
